<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment | Online Exam Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The assessment page is populated with the approved user's assigned questions. -->
<header class="site-header"><a class="brand" href="user-dashboard.html"><span class="brand-mark">+</span> Online Exam Portal</a><button id="logout" class="outline-button" type="button">Sign out</button></header>
<main class="assessment-shell">
    <p class="eyebrow">Assigned assessment</p>
    <h1 id="set-name">Loading questions...</h1>
    <p id="assessment-message" class="intro-copy">Answer every question before submitting.</p>
    <form id="assessment-form" class="question-list"></form>
    <button id="submit-assessment" class="primary-button" type="submit" form="assessment-form" disabled>Submit assessment</button>
</main>
<script src="js/assessment.js"></script>
</body>
</html>
