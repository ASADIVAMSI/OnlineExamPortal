<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Online Exam Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The admin page displays users, assignments, and submitted assessment results. -->
<main class="admin-shell">
    <p class="eyebrow">Online Exam Portal / Admin</p>
    <h1>User approvals</h1>
    <p class="intro-copy">Review registered users before they receive assessment access.</p>
    <p id="admin-message" class="message" role="status"></p>
    <div id="users" class="user-list"></div>
    <section class="submission-section">
        <h2>Submitted assessments <span id="submission-count" class="notification-badge">0</span></h2>
        <div id="submissions" class="submission-list"></div>
    </section>
</main>
<script src="js/admin.js"></script>
</body>
</html>
