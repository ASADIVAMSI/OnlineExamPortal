<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | Online Exam Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The dashboard shows approval status and enables assessment access when ready. -->
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">+</span> Online Exam Portal</a><button id="logout" class="outline-button" type="button">Sign out</button></header>
<main class="dashboard-shell">
    <p class="eyebrow">User dashboard</p>
    <h1 id="welcome">Your assessment journey</h1>
    <p id="dashboard-message" class="intro-copy">Checking your account status...</p>
    <section class="status-panel">
        <div><span class="status-label">Approval status</span><strong id="approval-status">Loading</strong></div>
        <div><span class="status-label">Assigned question set</span><strong id="assigned-set">Not assigned</strong></div>
        <button id="start-assessment" class="primary-button" type="button" disabled>Start assessment</button>
    </section>
</main>
<script src="js/user.js"></script>
</body>
</html>
