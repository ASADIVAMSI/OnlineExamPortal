# Spring Boot application and HTTP port.
spring.application.name=onlineexamportal-backend
server.port=8080
# Serve the built React frontend from the frontend/dist folder.
spring.web.resources.static-locations=file:../frontend/dist/

# MySQL connection settings. Change these values for a different local database.
spring.datasource.url=jdbc:mysql://localhost:3306/online_exam
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates or updates tables from the entity classes during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
